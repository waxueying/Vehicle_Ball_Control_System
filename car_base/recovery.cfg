# MSPM0 Recovery Script - 通过 SECAP (AP2) 的 DSSM 命令恢复变砖芯片
# 策略: 跳过 target 创建，直接通过 DAP 操作 AP2 (SECAP) 和 AP4 (PWR_AP)

echo "===== MSPM0 Recovery via SECAP/DSSM ====="

source [find bitsbytes.tcl]
transport select swd

# 手动创建 DAP (不创建 target，避免 init 时 target examine 失败)
set _CHIPNAME mspm0x
set _DAP_SWD_ID 0x2ba01477

source [find target/swj-dp.tcl]
swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $_DAP_SWD_ID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# 只初始化 DAP 层，不 examine target
init

echo "===== DP initialized, trying PWR_AP and SECAP ====="

# 步骤1: 通过 PWR_AP (AP4) 强制唤醒调试域电源
echo {[1] Power domain wakeup via PWR_AP (AP4)...}
catch { $mspm0x.dap apreg 4 0x00 0x104008 }
catch { $mspm0x.dap apreg 4 0xF0 0x01 }
catch { $mspm0x.dap apreg 4 0x00 0x100008 }
echo "    PWR_AP done"
sleep 500

# 步骤2: 通过 SECAP (AP2) 发送 Mass Erase 命令
# SECAP 寄存器: TCR=0x4, TDR=0x0, RXD=0x8, RCR=0xC
echo {[2] Sending Mass Erase (0x020c) via SECAP (AP2)...}
catch { $mspm0x.dap apreg 2 0x8 }       ;# 读 RXD 清状态
catch { $mspm0x.dap apreg 2 0xc }       ;# 读 RCR 清状态
catch { $mspm0x.dap apreg 2 0x4 0x020c } ;# TCR = 0x020c (Mass Erase)
catch { $mspm0x.dap apreg 2 0x0 0x0 }    ;# TDR = 0
echo "    Command sent, waiting for ROM to process..."
sleep 3000

# 步骤3: 等待 SECAP 响应
echo {[3] Checking SECAP response...}
set rcr_val 0
catch { set rcr_val [$mspm0x.dap apreg 2 0xc] }
set rxd_val 0
catch { set rxd_val [$mspm0x.dap apreg 2 0x8] }
echo "    RCR=0x[format %08X $rcr_val] RXD=0x[format %08X $rxd_val]"

# 步骤4: 触发板级复位
echo {[4] Board reset...}
catch {
    reset_config srst_only
    reset
}
sleep 1000

echo "===== Recovery Complete! ====="
echo "Now close this terminal and run 'Flash MSPM0' task."
shutdown
